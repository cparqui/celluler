cell:
  id: "cell-1"
  name: "Example Cell"
  logger:
    type: "Pino"
    options:
      level: "info"
      pino:
        # Passed to pino(): https://getpino.io/#/docs/api?id=options
        options:
          name: "cell-1"
          transport:
            targets:
              - target: "pino/file"
                level: "info"
                options:
                  destination: "logs/cell-1.log"
                  mkdir: true
              - target: "pino/file"
                level: "error"
                options:
                  destination: "logs/cell-1-error.log"
                  mkdir: true

transporter:
  type: "NATS"
  options:
    host: "localhost"
    port: 4222 